# Expected HTTP status: 200
id = "open-meteo-Forecast-02-daily"
name = "Three day forecast for Tokyo"
schema_version = 1

[request]
type = "http"
method = "GET"
path = "/v1/forecast"
headers = [["Accept", "application/json"]]
query = [
    ["latitude", "35.68"],
    ["longitude", "139.69"],
    ["daily", "temperature_2m_max,temperature_2m_min,precipitation_sum"],
    ["timezone", "Asia/Tokyo"],
    ["forecast_days", "3"],
]

[test]
status = 200
