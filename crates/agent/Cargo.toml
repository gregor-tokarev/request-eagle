[package]
name = "agent"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
# Runs coding agents such as Claude Code, Codex and OpenCode, which speak it.
agent-client-protocol = { version = "3.3", features = ["process"] }
futures = "0.3"
gpui-kit.workspace = true
preferences = { path = "../preferences" }
serde_json = "1"
shell-words = "1"

[dev-dependencies]
tempfile = "3"
