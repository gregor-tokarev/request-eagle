[package]
name = "preferences"
version = "0.1.0"
edition = "2024"

[[test]]
name = "native_keyring"
# GPUI's native application loop must run on the process's main thread.
harness = false

[dependencies]
anyhow.workspace = true
async-lock = "3"
futures-channel = "0.3"
gpui-kit.workspace = true
request = { path = "../request" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
