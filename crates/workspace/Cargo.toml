[package]
name = "workspace"
version = "0.1.0"
edition = "2024"

[features]
dev-profiler = ["dep:gpui-fps"]

[dependencies]
collection = { path = "../collection" }
collection_panel = { path = "../collection_panel" }
settings_ui = { path = "../settings_ui" }
gpui-fps = { version = "=0.6.2", optional = true }
gpui-kit = { workspace = true, features = ["component", "tree-sitter", "tree-sitter-html"] }
preferences = { path = "../preferences" }
request = { path = "../request" }
serde_json = "1"
keybindings_service = { path = "../keybindings_service" }
updater = { path = "../updater" }
request_eagle_theme = { package = "theme", path = "../theme" }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
smol = "2"
