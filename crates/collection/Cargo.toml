[package]
name = "collection"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["ui"]
# The `Collections` entity that the app's sidebar and tabs share.
ui = ["dep:gpui-kit"]

[dependencies]
environment = { path = "../environment" }
gpui-kit = { workspace = true, optional = true }
request = { path = "../request" }
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true
toml = "1.1.3"
toml_edit = "0.25.13"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
