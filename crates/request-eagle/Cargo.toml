[package]
name = "request-eagle"
version = "0.1.13"
edition = "2024"

[features]
dev-profiler = ["dep:gpui-fps"]

[dependencies]
collection = { path = "../collection" }
preferences = { path = "../preferences" }
gpui-fps = { version = "=0.6.2", optional = true }
gpui-kit = { workspace = true, features = ["component", "assets"] }
keybindings_service = { path = "../keybindings_service" }
reqwest_client.workspace = true
updater = { path = "../updater" }
request-eagle-theme = { package = "theme", path = "../theme" }
workspace = { package = "workspace", path = "../workspace" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
