[package]
name = "request-eagle"
version = "0.1.21"
edition = "2024"
license.workspace = true

[features]
dev-profiler = ["dep:gpui-fps"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
collection = { path = "../collection" }
environment = { path = "../environment" }
flow = { path = "../flow" }
request_history = { package = "history", path = "../history" }
preferences = { path = "../preferences" }
gpui-fps = { version = "=0.6.2", optional = true }
gpui-kit = { workspace = true, features = ["component", "assets"] }
keybindings_service = { path = "../keybindings_service" }
log = "0.4"
reqwest_client.workspace = true
request = { path = "../request" }
updater = { path = "../updater" }
request-eagle-theme = { package = "theme", path = "../theme" }
workspace = { package = "workspace", path = "../workspace" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "stdio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }

[dev-dependencies]
tempfile = "3"

# Unconditional, because a cfg here would match the build machine rather than
# the target when cross-compiling for Windows.
[build-dependencies]
winresource = "0.1"
