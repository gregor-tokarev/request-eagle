[package]
name = "request"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
percent-encoding = "2"
http_client = { package = "gpui-pre-http-client", version = "=0.3.5" }
# Use the same reqwest fork as GPUI's runtime adapter.
reqwest = { package = "gpui-pre-reqwest", version = "=0.12.15", default-features = false, features = ["http2", "rustls-tls-native-roots"] }
reqwest_client.workspace = true
serde = { version = "1", features = ["derive"] }
smol = "2"
thiserror.workspace = true
url = "2"

[dev-dependencies]
h2 = "0.4"
rustls-pemfile = "2"
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util"] }
tokio-rustls = "0.26"
