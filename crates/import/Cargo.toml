[package]
name = "import"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
base64 = "0.22"
collection = { path = "../collection", default-features = false }
percent-encoding = "2"
request = { path = "../request" }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
# Folders and requests follow the order of the source document.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
