[package]
name = "fql"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = "2"
percent-encoding = "2"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# Grows the stack of deeply nested evaluations instead of overflowing it.
stacker = "0.1"
