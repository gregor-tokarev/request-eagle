[package]
name = "updater"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit.workspace = true
preferences = { path = "../preferences" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "1", features = ["fs"] }
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[build-dependencies]
serde_json = "1"
