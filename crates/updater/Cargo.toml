[package]
name = "updater"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit.workspace = true
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smol = "2"
tempfile = "3"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
