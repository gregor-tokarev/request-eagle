[package]
name = "tab_ui"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
base64 = "0.22"

environment = { path = "../environment" }
event-listener = "5"
aho-corasick = "1"
anyhow.workspace = true
collection = { path = "../collection" }
flate2 = "1"
futures-channel = "0.3"
gpui-kit = { workspace = true, features = ["component", "tree-sitter", "tree-sitter-html", "tree-sitter-javascript"] }
lsp-types = "0.97"
preferences = { path = "../preferences" }
request = { path = "../request" }
ropey = "=2.0.0-beta.1"
rquickjs = "0.14"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
gpui-kit = { workspace = true, features = ["test-support"] }
request_eagle_theme = { package = "theme", path = "../theme" }
smol = "2"
