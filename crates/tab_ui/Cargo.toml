[package]
name = "tab_ui"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
aho-corasick = "1"
collection = { path = "../collection" }
gpui-kit = { workspace = true, features = ["component", "tree-sitter", "tree-sitter-html"] }
preferences = { path = "../preferences" }
request = { path = "../request" }
serde_json = "1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
request_eagle_theme = { package = "theme", path = "../theme" }
smol = "2"
