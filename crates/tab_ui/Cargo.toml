[package]
name = "tab_ui"
version = "0.1.0"
edition = "2024"

[dependencies]
environment = { path = "../environment" }
aho-corasick = "1"
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
collection = { path = "../collection" }
futures = "0.3"
gpui-kit = { workspace = true, features = ["component", "tree-sitter", "tree-sitter-bash", "tree-sitter-html", "tree-sitter-javascript"] }
import = { path = "../import" }
lsp-types = "0.97"
preferences = { path = "../preferences" }
request = { path = "../request" }
request_eagle_theme = { package = "theme", path = "../theme" }
ropey = "=2.0.0-beta.1"
script_intelligence = { path = "../script_intelligence" }
serde_json = "1"
unicode-segmentation = "1.13"

[dev-dependencies]
smol = "2"
