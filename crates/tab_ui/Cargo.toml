[package]
name = "tab_ui"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
aho-corasick = "1"
anyhow.workspace = true
collection = { path = "../collection" }
gpui-kit = { workspace = true, features = ["component", "tree-sitter", "tree-sitter-html", "tree-sitter-javascript"] }
lsp-types = "0.97"
preferences = { path = "../preferences" }
request = { path = "../request" }
ropey = "=2.0.0-beta.1"
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-javascript = "0.23"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
request_eagle_theme = { package = "theme", path = "../theme" }
smol = "2"
