name: Promote to stable

# Make a nightly release the latest stable release, so stable installs update
# to it. Its files are not rebuilt: stable gets the build nightly already ran.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Nightly vX.Y.Z tag to promote. Leave empty for the newest nightly.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: promote-to-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # Tags are needed for the release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Promote the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$TAG" ]]; then
            TAG="$(gh release list --limit 100 --json tagName,isPrerelease \
              --jq '[.[] | select(.isPrerelease)][0].tagName // ""')"
          fi

          if [[ -z "$TAG" || "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != true ]]; then
            echo "There is no nightly release ${TAG:-to promote}." >&2
            exit 1
          fi

          # Stable installs only move forward, so the latest release must too.
          stable="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -n "$stable" && "$(printf '%s\n' "$stable" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]]; then
            echo "$TAG is older than the stable release $stable." >&2
            exit 1
          fi

          # Stable users see everything merged since the previous stable release.
          python3 scripts/release-notes.py markdown "$TAG" ${stable:+"$stable"} > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

          gh release edit "$TAG" --prerelease=false --latest --notes-file "$RUNNER_TEMP/notes.md"
          echo "Promoted $TAG to stable"
