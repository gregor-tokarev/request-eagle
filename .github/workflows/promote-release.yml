name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Pre-release vX.Y.Z tag to make stable (defaults to the newest pre-release)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mark the pre-release as the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ -z "$TAG" ]]; then
            TAG="$(gh api "repos/$GH_REPO/releases" \
              --jq '[.[] | select(.prerelease and (.draft | not))][0].tag_name // empty')"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z pre-release to promote, got: '$TAG'" >&2
            exit 1
          fi

          # Stable users read this manifest through releases/latest. It links
          # the archive by its tag, so it stays valid after promotion.
          gh release download "$TAG" --pattern request-eagle-update.json --output - |
            jq -e \
              --arg version "${TAG#v}" \
              --arg archives "https://github.com/$GH_REPO/releases/download/$TAG/" \
              '.version == $version and (.url | startswith($archives)) and (.sha256 | test("^[0-9a-f]{64}$"))'

          gh release edit "$TAG" --prerelease=false --latest
          echo "Promoted $TAG"
