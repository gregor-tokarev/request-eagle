name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: macos-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-test-
      - name: Test every crate, including the macOS credential backend
        run: cargo test --locked --workspace --no-fail-fast

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Install Arch build and test dependencies
        run: |
          pacman --disable-sandbox -Syu --noconfirm --needed rust cmake clang git fontconfig \
            freetype2 libxcb libxkbcommon-x11 wayland openssl vulkan-headers \
            vulkan-swrast mesa dbus xorg-server-xvfb xorg-xauth xdotool ttf-dejavu keepassxc weston

      - uses: actions/checkout@v7

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arch-${{ hashFiles('Cargo.lock') }}
          restore-keys: arch-

      - name: Build and test the standalone CLI without desktop features
        run: |
          cargo build --locked -p request-eagle-cli
          cargo test --locked -p request-eagle-cli

      - name: Build Linux app and native credential check
        run: cargo build --locked -p request-eagle -p preferences --all-targets

      - name: Test every crate
        run: cargo test --locked --workspace --no-fail-fast

      - name: Save Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arch-${{ hashFiles('Cargo.lock') }}

      - name: Check storage with KeePassXC and without a provider
        run: ./scripts/check-linux-keyring.sh

      - name: Open and render the app on Wayland
        run: |
          runtime=$(mktemp -d)
          export XDG_RUNTIME_DIR="$runtime"
          trap 'rm -rf "$runtime"' EXIT

          # The single-quoted command expands variables in Weston's child shell.
          # shellcheck disable=SC2016
          weston --backend=headless --renderer=pixman --fake-seat \
            --shell=kiosk-shell.so --width=1280 --height=800 --idle-time=0 \
            --socket=wayland-test --no-config --log="$runtime/weston.log" -- \
            env WAYLAND_DISPLAY=wayland-test WAYLAND_DEBUG=1 \
              REQUEST_EAGLE_WINDOW_TITLE='Request Eagle (Arch compatibility)' \
              REQUEST_EAGLE_COLLECTIONS_DIR="$runtime/collections" \
              bash -c 'timeout 15s target/debug/request-eagle; test "$?" -eq 124 && touch "$XDG_RUNTIME_DIR/survived"' \
            >"$runtime/app.log" 2>&1

          if ! test -f "$runtime/survived" || \
            ! grep -Eq 'wl_surface#[0-9]+\.attach\(wl_buffer' "$runtime/app.log"; then
            cat "$runtime/weston.log" "$runtime/app.log"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install Arch build dependencies
        run: |
          pacman --disable-sandbox -Syu --noconfirm --needed rust cmake clang git fontconfig \
            freetype2 libxcb libxkbcommon-x11 wayland openssl vulkan-headers dbus

      - uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arch-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: arch-lint-

      - name: Lint every crate
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Save Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arch-lint-${{ hashFiles('Cargo.lock') }}

  debian:
    runs-on: ubuntu-latest
    # The oldest supported release, so the package also installs on newer ones.
    container: debian:bookworm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Install Debian build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 \
            build-essential cmake clang pkg-config dpkg-dev libfontconfig-dev libfreetype-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev xvfb xauth imagemagick
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Tags are needed for the release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: debian-${{ hashFiles('Cargo.lock') }}
          restore-keys: debian-

      # Release builds embed notes from the same script. Checkout trusts the
      # container's workspace for its own Git calls only.
      - name: Write release notes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          python3 scripts/release-notes.py json "$tag" > "$RUNNER_TEMP/release-notes.json"
          echo "REQUEST_EAGLE_RELEASE_NOTES=$RUNNER_TEMP/release-notes.json" >> "$GITHUB_ENV"

      - name: Test preferences, updates, and settings
        run: cargo test --locked -p preferences -p settings_ui -p updater

      - name: Build the Debian package
        env:
          PROFILE: dev
        run: ./scripts/package-debian.sh

      - name: Save Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: debian-${{ hashFiles('Cargo.lock') }}

      - name: Install the package and open the app on X11
        run: |
          apt-get install -y ./dist/request-eagle_*.deb
          test -f /usr/share/applications/com.egortokarev.requesteagle.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/com.egortokarev.requesteagle.png

          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"

          # The single-quoted script expands variables in Xvfb's shell.
          # shellcheck disable=SC2016
          xvfb-run -a -s '-screen 0 1280x800x24' bash -c '
            request-eagle > "$HOME/app.log" 2>&1 &
            app=$!
            sleep 20
            import -window root "$GITHUB_WORKSPACE/debian.png"
            kill -0 "$app" && kill "$app"
          ' || { cat "$HOME/app.log"; exit 1; }

      # Container jobs see the runner's temporary directory at another path,
      # so the screenshot stays in the workspace.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-screenshot
          path: debian.png
          if-no-files-found: ignore

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-

      - name: Build the installer
        env:
          PROFILE: dev
        run: |
          choco install innosetup --no-progress -y
          ./scripts/package-windows.ps1

      # Later failures still keep the build, so the next run does not start over.
      - name: Save Cargo cache
        if: ${{ !cancelled() && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}

      - name: Test storage, preferences, updates, and settings
        timeout-minutes: 30
        run: cargo test --locked --no-fail-fast -p preferences -p settings_ui -p updater -p collection -p environment -p history -p request --lib

      # One at a time, so the log names a test that hangs. Windows does not
      # stop a hung test at a step timeout, so this stops it and keeps the log.
      - name: Test sending requests
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --no-run -p request --tests
          $log = "$env:RUNNER_TEMP\request-tests.log"
          $tests = Start-Process cargo -NoNewWindow -PassThru `
            -ArgumentList 'test', '--locked', '--no-fail-fast', '-p', 'request', '--tests', '--', '--test-threads=1' `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          # PowerShell only reports the exit code of a process whose handle it opened.
          $null = $tests.Handle

          $finished = $tests.WaitForExit(15 * 60 * 1000)
          if (-not $finished) { taskkill /T /F /PID $tests.Id | Out-Null }
          Get-Content "$log.err", $log
          if (-not $finished) { throw 'A request test hung' }
          if ($tests.ExitCode -ne 0) { throw "Request tests failed with code $($tests.ExitCode)" }

      - name: Store credentials in Windows Credential Manager
        if: ${{ !cancelled() }}
        run: cargo test --locked -p preferences --test native_keyring -- --round-trip

      - name: Install and open the app
        if: ${{ !cancelled() }}
        run: |
          $setup = (Get-ChildItem dist\RequestEagle-*-x64-setup.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait

          # The updater recognizes an installed copy by its uninstaller.
          $install = "$env:LOCALAPPDATA\Programs\Request Eagle"
          if (-not (Test-Path "$install\unins000.exe")) { throw 'The installer did not install Request Eagle' }

          # The C runtime is linked in, so machines without the Visual C++ Redistributable can run it.
          $binary = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("$install\request-eagle.exe"))
          if ($binary.Contains('VCRUNTIME140.dll', [System.StringComparison]::OrdinalIgnoreCase)) { throw 'Request Eagle needs the Visual C++ Redistributable' }

          $app = Start-Process "$install\request-eagle.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "Request Eagle exited with code $($app.ExitCode)" }

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $screenshot = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($screenshot).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $screenshot.Save("$env:RUNNER_TEMP\windows.png")
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: ${{ runner.temp }}/windows.png
          if-no-files-found: ignore
