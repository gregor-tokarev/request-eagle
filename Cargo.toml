[workspace]
members = [
    "crates/request-eagle-cli",
    "crates/collection",
    "crates/collections_panel_ui",
    "crates/environment",
    "crates/history",
    "crates/import",
    "crates/keybindings_service",
    "crates/preferences",
    "crates/request",
    "crates/script_intelligence",
    "crates/theme",
    "crates/updater",
    "crates/workspace",
    "crates/settings_ui",
    "crates/tab_ui",
    "crates/request-eagle",
]
default-members = ["crates/request-eagle"]
resolver = "3"

# Shipped app builds. Whole-program optimization makes the binary a third
# smaller and launch a little faster, but takes several times longer to build,
# so development keeps the release profile.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[workspace.dependencies]
anyhow = "1"
gpui-kit = { version = "=0.6.2", default-features = false }
# Match GPUI Kit's HTTP client version to keep the GPUI HTTP traits compatible.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.5" }
thiserror = "2"

[patch.crates-io]
# GPUI Kit 0.6.2 with editor fixes; see patches/gpui-kit/README.md.
gpui-base = { git = "https://github.com/gregor-tokarev/gpui-kit", rev = "c38733a06868b10813788ca3ebbace790eeb65b1" }
gpui-component = { git = "https://github.com/gregor-tokarev/gpui-kit", rev = "c38733a06868b10813788ca3ebbace790eeb65b1" }
gpui-kit-assets = { git = "https://github.com/gregor-tokarev/gpui-kit", rev = "c38733a06868b10813788ca3ebbace790eeb65b1" }
