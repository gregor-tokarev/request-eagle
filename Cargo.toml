[workspace]
members = [
    "crates/request-eagle-cli",
    "crates/collection",
    "crates/collections_panel_ui",
    "crates/environment",
    "crates/flow",
    "crates/fql",
    "crates/history",
    "crates/import",
    "crates/keybindings_service",
    "crates/preferences",
    "crates/request",
    "crates/script_intelligence",
    "crates/theme",
    "crates/updater",
    "crates/workspace",
    "crates/settings_ui",
    "crates/tab_ui",
    "crates/request-eagle",
]
default-members = ["crates/request-eagle"]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"

# Shipped app builds. Whole-program optimization makes the binary a third
# smaller and launch a little faster, but takes several times longer to build,
# so development keeps the release profile.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Dev and test builds keep full debug info for our own crates only. Dependencies
# get line tables, so backtraces still show file and line. Full dependency debug
# info made every test binary close to 1 GB, and relinking dozens of them per
# test run wrote tens of GB to the build machine's SSD.
[profile.dev.package."*"]
debug = "line-tables-only"

[workspace.dependencies]
anyhow = "1"
gpui-kit = { version = "=0.7.0", default-features = false }
# Match GPUI Kit's HTTP client version to keep the GPUI HTTP traits compatible.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }
thiserror = "2"

[patch.crates-io]
# GPUI Kit 0.7.0 with editor fixes; see patches/gpui-kit/README.md.
gpui-base = { git = "https://github.com/gregor-tokarev/gpui-kit", rev = "e44d39248944fa18ae9636cc8987a8ccfada8c9b" }
gpui-component = { git = "https://github.com/gregor-tokarev/gpui-kit", rev = "e44d39248944fa18ae9636cc8987a8ccfada8c9b" }
gpui-kit-assets = { git = "https://github.com/gregor-tokarev/gpui-kit", rev = "e44d39248944fa18ae9636cc8987a8ccfada8c9b" }
