[workspace]
members = [
    "crates/collection",
    "crates/collection_panel",
    "crates/environment",
    "crates/keybindings_service",
    "crates/preferences",
    "crates/theme",
    "crates/updater",
    "crates/workspace",
    "crates/settings_ui",
    "crates/request-eagle",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
gpui-kit = { version = "=0.6.0", default-features = false }
# Match GPUI Kit's HTTP client version to keep the GPUI HTTP traits compatible.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.1" }
thiserror = "2"

# gpui-pre-macros 0.3.1 leaves its inspector helper ungated in release builds.
# Compile that host-side macro crate with debug assertions; the app stays optimized.
[profile.release.package.gpui-pre-macros]
debug-assertions = true
