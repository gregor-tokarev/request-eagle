[workspace]
members = [
    "crates/collection",
    "crates/collections_panel_ui",
    "crates/environment",
    "crates/keybindings_service",
    "crates/preferences",
    "crates/request",
    "crates/theme",
    "crates/updater",
    "crates/workspace",
    "crates/settings_ui",
    "crates/tab_ui",
    "crates/request-eagle",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
gpui-kit = { version = "=0.6.2", default-features = false }
# Match GPUI Kit's HTTP client version to keep the GPUI HTTP traits compatible.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.5" }
thiserror = "2"

[patch.crates-io]
# GPUI Kit 0.6.2 with same-frame completion positioning; see patches/gpui-kit/README.md.
gpui-base = { git = "https://github.com/gregor-tokarev/gpui-kit", rev = "aae12bf4dbf4c70e35329a7715abed9f33731fe7" }
gpui-component = { git = "https://github.com/gregor-tokarev/gpui-kit", rev = "aae12bf4dbf4c70e35329a7715abed9f33731fe7" }
gpui-kit-assets = { git = "https://github.com/gregor-tokarev/gpui-kit", rev = "aae12bf4dbf4c70e35329a7715abed9f33731fe7" }
